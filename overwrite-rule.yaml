# 只改 url，type/behavior/format/interval/path 由递归合并保留
rule-providers:
  ADBlock:
    url: https://cdn.jsdelivr.net/gh/217heidai/adblockfilters@main/rules/adblockmihomo.yaml
+proxy-groups:
  # pximg 专用自愈组：探测 URL 直指 i.pximg.net。
  # 不能用「自动选择」——它按通用 URL 测速，会漂到被 pximg CDN 拉黑的口岸（日本/新加坡）。
  # 2026-11-01 实测：香港三个点全挂、台湾超时，日本家宽 Vless（日本1-6号）同样被拒（504），
  # 但 AWS日本4号 196ms、美国1号 323ms 可通，故补入这两个兜底出口。
  - name: pximg
    type: url-test
    url: https://i.pximg.net/
    interval: 300
    tolerance: 100
    proxies:
      - 🇹🇼台湾
      - 🇭🇰香港家宽专线
      - 🇭🇰香港HKBN
      - 🇭🇰香港HKBN2
      - 🇯🇵AWS日本4号
      - 🇺🇸美国1号-0.1倍率
  # Twitch 直播负载均衡组。
  # 单个节点对单条 TCP 限速约 2.5 Mbps，而 720p 档位就要 2.55 Mbps，卡在临界线上；
  # 同批分片多连接并发可达 11+ Mbps，说明总带宽够、瓶颈是单流 QoS。
  # round-robin 让不同分片落到不同节点，把多个节点的单流带宽叠加。
  # 探测 URL 必须返回 200：usher.ttvnw.net 裸 GET 是 403，会让整组被判不健康而失效。
  #
  # 成员用 include-all + filter 动态筛，不写死节点名：
  # 写死的话换机场或订阅改名后整组变空，而下面六条规则仍然指着它，Twitch 直接断。
  # filter 的值刻意不含竖线 —— OpenClash 生成配置时走 shell eval，`|` 会被当管道吃掉，
  # 导致 filter 整键丢失、include-all 反把全部节点（含美国）拉进来。
  # 节点名不含「香港」二字时（例如 HK-01），把下面这行改成 HK，同样别带竖线。
  # 关键词与 flclash-override.js 的 TWITCH_KEYWORDS 保持一致，改一处要同步另一处。
  - name: Twitch-LB
    type: load-balance
    url: https://static.twitchcdn.net/config/settings.js
    interval: 300
    strategy: round-robin
    include-all: true
    filter: "香港"
+rules:
  # Nexon / MapleStory（必须最优先，靠 +rules 前置生效）
  # 账号是 North America / GMS Classic：DIRECT（中国 IP）→ forbidden 黑屏；日本节点 → 锁区
  - DOMAIN-SUFFIX,nexon.com,美国节点
  - DOMAIN-SUFFIX,nexon.net,美国节点
  - DOMAIN-SUFFIX,nexon.io,美国节点
  - DOMAIN-SUFFIX,nexoncdn.com,美国节点
  - DOMAIN-SUFFIX,nexonstatic.com,美国节点
  - DOMAIN-SUFFIX,maplestory.com,美国节点
  - DOMAIN-SUFFIX,maplestory.net,美国节点
  - DOMAIN-SUFFIX,maplestoryworlds.com,美国节点
  # ---- Twitch 直播（走上面的 Twitch 负载均衡组）----
  # ttvnw.net 覆盖 usher / video-edge / apn11.playlist 等全部取流域名。
  - DOMAIN-SUFFIX,twitch.tv,Twitch-LB
  - DOMAIN-SUFFIX,ttvnw.net,Twitch-LB
  - DOMAIN-SUFFIX,twitchcdn.net,Twitch-LB
  - DOMAIN-SUFFIX,jtvnw.net,Twitch-LB
  - DOMAIN-SUFFIX,twitchsvc.net,Twitch-LB
  - DOMAIN-SUFFIX,ext-twitch.tv,Twitch-LB
  # 游戏本体 + 反作弊进程 DIRECT（不代理，交给 UU）
  - PROCESS-NAME,MapleStory.exe,DIRECT
  - PROCESS-NAME,MapleStory_Classic.exe,DIRECT
  - PROCESS-NAME,Launcher.dat,DIRECT
  - PROCESS-NAME,BlackCipher.exe,DIRECT
  - PROCESS-NAME,BlackCipher64.exe,DIRECT
  - PROCESS-NAME,NexonSecurity.exe,DIRECT

  # ============ 直连 DIRECT ============
  - DOMAIN-SUFFIX,2go2.top,DIRECT
  - DOMAIN-SUFFIX,adblockplus.dev,DIRECT
  - DOMAIN-SUFFIX,asus.com,DIRECT
  - DOMAIN-SUFFIX,diplnk.com,DIRECT
  - DOMAIN-SUFFIX,wdpsmc.cn,DIRECT
  - DOMAIN-SUFFIX,wenku8.net,DIRECT
  - DOMAIN-SUFFIX,wenku8.com,DIRECT
  # pixiv/fanbox 图片域，走上面的 pximg 组
  - DOMAIN-SUFFIX,pximg.net,pximg

  # ============ 屏蔽 REJECT ============
