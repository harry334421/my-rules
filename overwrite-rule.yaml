  # 注：PROCESS-NAME 只匹配路由器自身进程。
  # QQ.exe / TeamSpeak.exe / Photoshop.exe 跑在局域网 PC 上，
  # 旁路由的 Clash 看不到这些进程名，写了也不会命中。
  # - PROCESS-NAME,QQ.exe,DIRECT
  # - PROCESS-NAME,TeamSpeak.exe,DIRECT
  # - PROCESS-NAME,Photoshop.exe,REJECT

  # ============ 兜底规则（务必放最后）============
  - IP-CIDR6,240e::/16,DIRECT
  - IP-CIDR6,2408::/16,DIRECT
  - IP-CIDR6,2409::/16,DIRECT

dns:
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - 223.5.5.5
  # 2026-11-07: 补回 fallback。此前只有 fallback-filter 没有 fallback 列表，
  # 过滤器形同虚设，被墙域名也走国内 DoH 而被投毒（doh.pub 对 hitomi.la
  # 返回过 173.252.108.3 这个 Facebook 段地址）。#一分机场 表示经该代理组查询，
  # 实测 dns.google / 1.1.1.1 的 DoH 直连被封、经代理可正常返回真实 IP。
  fallback:
    - https://1.1.1.1/dns-query#一分机场
    - https://dns.google/dns-query#一分机场
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
  # 删除主配置里把 google/youtube/github/openai 指向国内 DoH 的 policy，
  # 改由上面的 fallback-filter 统一判定
  nameserver-policy-:
  +fake-ip-filter:
    - +.wdpsmc.cn
