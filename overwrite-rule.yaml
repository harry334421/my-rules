# 只改 url，type/behavior/format/interval/path 由递归合并保留
rule-providers:
  ADBlock:
    url: https://cdn.jsdelivr.net/gh/217heidai/adblockfilters@main/rules/adblockmihomo.yaml
+proxy-groups:
  # pximg 专用自愈组：探测 URL 直指 i.pximg.net。
  # 不能用「自动选择」——它按通用 URL 测速，会漂到被 pximg CDN 拉黑的口岸（日本/新加坡）。
  - name: pximg
    type: url-test
    url: https://i.pximg.net/
    interval: 300
    tolerance: 100
    proxies:
      - 🇹🇼台湾
      - 🇭🇰香港家宽专线
      - 🇭🇰香港HKBN
      - 🇭🇰香港HKBN2
+rules:
  # ============ 直连 DIRECT ============
  - DOMAIN-SUFFIX,2go2.top,DIRECT
  - DOMAIN-SUFFIX,adblockplus.dev,DIRECT
  - DOMAIN-SUFFIX,asus.com,DIRECT
  - DOMAIN-SUFFIX,diplnk.com,DIRECT
  - DOMAIN-SUFFIX,wdpsmc.cn,DIRECT
  - DOMAIN-SUFFIX,wenku8.net,DIRECT
  - DOMAIN-SUFFIX,wenku8.com,DIRECT
  # pixiv/fanbox 图片域，走上面的 pximg 组
  - DOMAIN-SUFFIX,pximg.net,pximg

  # ============ 屏蔽 REJECT ============
  # Adobe 全家桶
  - DOMAIN-SUFFIX,adobe.com,REJECT
  - DOMAIN-SUFFIX,adobe.io,REJECT
  - DOMAIN-SUFFIX,adobelogin.com,REJECT
  - DOMAIN-SUFFIX,adobegenuine.com,REJECT
  - DOMAIN-SUFFIX,tly.bet,REJECT
  # 广告域名
  - DOMAIN-SUFFIX,doubleclick.net,REJECT
  - DOMAIN-SUFFIX,smartadserver.com,REJECT
  - DOMAIN-SUFFIX,equativ.com,REJECT
  - DOMAIN-SUFFIX,casalemedia.com,REJECT

  # ============ PCDN（防偷跑上行）============
  # 通用 CDN
  - DOMAIN-SUFFIX,bsccdn.net,REJECT
  - DOMAIN-SUFFIX,gjfzpt.cn,REJECT
  - DOMAIN-SUFFIX,jomodns.cn,REJECT
  - DOMAIN-SUFFIX,kuiniuca.com,REJECT
  - DOMAIN-SUFFIX,pkoplink.com,REJECT
  - DOMAIN-SUFFIX,saxysec.com,REJECT
  - DOMAIN-SUFFIX,szbdyd.com,REJECT
  - DOMAIN-SUFFIX,uhabo.com,REJECT
  - DOMAIN-SUFFIX,xycdn.com,REJECT
  # 视频平台
  - DOMAIN-SUFFIX,mcdn.bilivideo.cn,REJECT
  - DOMAIN-SUFFIX,onethingpcs.com,REJECT
  - DOMAIN-SUFFIX,pcdn.xmcdn.com,REJECT
  - DOMAIN-SUFFIX,tpa-hcdn.iqiyi.com,REJECT
  # P2P 节点发现
  - DOMAIN-SUFFIX,p2p.huya.com,REJECT
  - DOMAIN-SUFFIX,p2p.qq.com,REJECT
  - DOMAIN-SUFFIX,p2ptun.qq.com,REJECT
  - DOMAIN-SUFFIX,p2pupdate.gamedl.qq.com,REJECT
  - DOMAIN-SUFFIX,p2pupgrade.gamedl.qq.com,REJECT
  - DOMAIN-SUFFIX,pcdn.yximgs.com,REJECT
  - DOMAIN-SUFFIX,stun.hitv.com,REJECT
  # 斗鱼
  - DOMAIN-SUFFIX,stun.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,stun1.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,dyp2p-ali.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,dyp2p-hw.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,p2p-ali.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,p2pchunk-hw.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,p2pchunk-table.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,p2pchunk-ws.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,p2perrorlog.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,p2plive-ali.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,p2plive-ws.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,p2plog.douyucdn.cn,REJECT
  - DOMAIN-SUFFIX,p2pvod-ws.douyucdn.cn,REJECT

  # 注：PROCESS-NAME 只匹配路由器自身进程。
  # QQ.exe / TeamSpeak.exe / Photoshop.exe 跑在局域网 PC 上，
  # 旁路由的 Clash 看不到这些进程名，写了也不会命中。
  # - PROCESS-NAME,QQ.exe,DIRECT
  # - PROCESS-NAME,TeamSpeak.exe,DIRECT
  # - PROCESS-NAME,Photoshop.exe,REJECT

  # ============ 兜底规则（务必放最后）============
  - IP-CIDR6,240e::/16,DIRECT
  - IP-CIDR6,2408::/16,DIRECT
  - IP-CIDR6,2409::/16,DIRECT

dns:
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - 223.5.5.5
  # 删掉插件默认写入的 fallback / fallback-filter（值为空即整键删除）
  fallback-:
  +fake-ip-filter:
    - +.wdpsmc.cn
